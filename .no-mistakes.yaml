# Per-repo no-mistakes overrides.

# Fail lint when gitleaks finds a secret in the branch's commits, or when gitleaks is missing.
# no-mistakes runs commands through cmd.exe on Windows, whose PATH has no `sh`; a git alias runs the script with git's own shell from the repo root.
commands:
  lint: 'git -c "alias.gitleaks-gate=!sh scripts/gitleaks-gate.sh" gitleaks-gate'

lint:
  instructions: |
    Never edit .gitleaksignore, any gitleaks config (.gitleaks.toml, gitleaks.toml, .gitleaks/) or scripts/gitleaks-gate.sh.
    Never rewrite, amend or drop commits to silence gitleaks. A gitleaks finding is escalated to the captain, never fixed by you.
